# Ruff 配置：ruff 版本见 requirements-dev.txt
# 仓库内 vendored 的校验脚本按原样保留，不参与本项目风格约束
exclude = ["tools/check_agents_md.py"]

target-version = "py311"
line-length = 120

[lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "S",   # flake8-bandit
  "TRY", # tryceratops
  "RUF",
]
ignore = [
  "S101",  # assert 在测试中合法
  "TRY003", # 长异常消息，本仓库统一用自定义异常类承载
  "RUF001", # 中文标点在中文注释与文案中是正常字符
  "RUF002",
  "RUF003",
]

[lint.per-file-ignores]
"tests/**" = ["S", "TRY"]
"plugin.py" = []

[lint.isort]
known-first-party = ["rsshub"]
