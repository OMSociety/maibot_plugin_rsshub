name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: test (sdk ${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ["2.16.0", "2.21.0"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt "maibot-plugin-sdk==${{ matrix.sdk }}"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: python -m pytest -q

  docs:
    name: agents-md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check webui declaration
        run: python tools/check_webui.py .

      - name: Check AGENTS.md
        run: python tools/check_agents_md.py --root . --no-path

  release:
    name: tag matches manifest
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare tag with manifest version
        run: |
          python -c "import json, os, sys; tag = os.environ['GITHUB_REF_NAME']; version = json.load(open('_manifest.json', encoding='utf-8'))['version']; print(f'tag={tag} manifest={version}'); sys.exit(0 if tag == f'v{version}' else 1)"
