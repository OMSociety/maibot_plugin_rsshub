<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RSS 订阅</title>
<style>
  /* 布局与结构交给这里；颜色、字体、边框、圆角全部来自宿主的 maibot-* 公共样式与变量。 */
  * { box-sizing: border-box; }
  html, body { max-width: 100%; overflow-x: hidden; }
  body { padding: 20px 24px 40px; }
  .page-note { margin: 0 0 10px; font-size: 13px; line-height: 1.6; }
  .page-title { font-family: var(--maibot-font-display); font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  .subtitle { font-size: 12px; margin-bottom: 16px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 16px 0 20px; }
  .stat-label { font-size: 12px; }
  .stat-value { font-size: 22px; font-weight: 600; margin-top: 4px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .toolbar .maibot-input { width: 240px; max-width: 100%; }
  .cards-list { display: grid; gap: 12px; }
  .sub-card { padding: 14px 16px; }
  .sub-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .sub-title { min-width: 0; flex: 1 1 260px; }
  .sub-actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .sub-actions .maibot-button { padding: 6px 12px; font-size: 12px; }
  .sub-meta { display: flex; flex-wrap: wrap; gap: 10px 28px; font-size: 13px; }
  .meta-item { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .meta-item .maibot-muted { flex: 0 0 auto; }
  .meta-item select.maibot-select, .meta-item input.maibot-input { padding: 5px 10px; font-size: 13px; }
  .meta-item select.maibot-select { min-width: 96px; }
  .meta-item input.maibot-input { width: 88px; }
  .cell-link { display: inline-block; max-width: 100%; overflow-wrap: anywhere; word-break: break-all; color: var(--maibot-primary); text-decoration: none; }
  .cell-link:hover { text-decoration: underline; }
  .sub-title .cell-link { font-weight: 600; }
  .history-list { display: grid; gap: 10px; }
  .history-card { padding: 12px 14px; font-size: 13px; }
  .history-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .history-body { display: grid; gap: 4px; }
  .history-meta { display: flex; flex-wrap: wrap; gap: 8px 16px; }
  .pager { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  .banner { margin: 8px 0 16px; padding: 10px 14px; font-size: 13px; }
  .banner.error { color: var(--maibot-danger); }
  .form-grid { display: grid; gap: 10px; max-width: 560px; }
  .form-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .form-row label { min-width: 72px; font-size: 13px; }
  .form-row .maibot-input { flex: 1; min-width: 180px; }
  textarea.maibot-input { width: 100%; min-height: 140px; font: inherit; font-size: 13px; resize: vertical; }
  .badge-retry { margin-left: 6px; }
  .hidden { display: none !important; }
  .empty { padding: 24px 16px; text-align: center; }
  .empty p { margin: 6px 0; }
  .empty .empty-title { font-size: 15px; font-weight: 600; }
  .loading { padding: 14px 12px; }

  @media (max-width: 640px) {
    body { padding: 14px 14px 28px; }
    .sub-head { flex-direction: column; align-items: stretch; }
    .sub-title { flex: 0 0 auto; }
    .sub-actions { justify-content: flex-start; }
    .toolbar .maibot-input { width: 100%; }
  }
</style>
</head>
<body class="maibot-page">
  <h1 class="page-title">RSS 订阅</h1>
  <p class="maibot-muted page-note">
    音频与视频按原文件推送需要宿主打开「设置 → 能力 → 文件功能」；关着时照常推送，音视频改为附链接。
  </p>
  <div class="maibot-muted subtitle" id="subtitle">正在加载…</div>
  <div class="maibot-card banner hidden" id="banner" role="status"></div>

  <section class="stats" id="cards"></section>

  <div class="tabs" role="tablist" aria-label="管理视图">
    <button class="maibot-button" role="tab" aria-selected="true" aria-pressed="true" data-view="subs">订阅</button>
    <button class="maibot-button" role="tab" aria-selected="false" aria-pressed="false" data-view="history">推送历史</button>
    <button class="maibot-button" role="tab" aria-selected="false" aria-pressed="false" data-view="import">批量导入</button>
  </div>

  <section id="view-subs">
    <div class="toolbar">
      <input class="maibot-input" id="keyword" placeholder="按标题、链接或会话筛选" aria-label="筛选订阅">
      <button class="maibot-button" id="reload-subs">刷新</button>
    </div>
    <div class="cards-list" id="subs-body"><div class="maibot-muted loading">加载中…</div></div>
    <div class="pager">
      <button class="maibot-button" id="subs-prev">上一页</button>
      <span class="maibot-muted" id="subs-page">1 / 1</span>
      <button class="maibot-button" id="subs-next">下一页</button>
    </div>
  </section>

  <section id="view-history" class="hidden">
    <div class="toolbar">
      <label class="maibot-muted" for="history-status">状态</label>
      <select class="maibot-select" id="history-status" aria-label="状态筛选">
        <option value="">全部状态</option>
        <option value="success">成功</option>
        <option value="failed">失败</option>
        <option value="stopped">已停止</option>
        <option value="skipped">已过滤</option>
      </select>
      <button class="maibot-button" id="reload-history">刷新</button>
    </div>
    <div class="history-list" id="history-body"><div class="maibot-muted loading">加载中…</div></div>
    <div class="pager">
      <button class="maibot-button" id="history-prev">上一页</button>
      <span class="maibot-muted" id="history-page">1 / 1</span>
      <button class="maibot-button" id="history-next">下一页</button>
    </div>
  </section>

  <section id="view-import" class="hidden">
    <p class="maibot-muted">每行一个 Feed 地址或 RSSHub 路由；会话留空时仅入库，不推送。</p>
    <div class="form-grid">
      <div class="form-row">
        <label class="maibot-muted" for="import-session">目标会话</label>
        <input class="maibot-input" id="import-session" placeholder="例如 qq:group:123456">
      </div>
      <div class="form-row">
        <label class="maibot-muted" for="import-title">标题前缀</label>
        <input class="maibot-input" id="import-title" placeholder="可留空">
      </div>
      <textarea class="maibot-input" id="import-links" placeholder="https://example.com/feed.xml&#10;/github/trending/daily"></textarea>
      <div><button class="maibot-button maibot-button-primary" id="do-import">导入</button></div>
    </div>
  </section>

  <script type="module">
    await maibot.ready;

    const state = { subs: { page: 1, pages: 1, keyword: '' }, history: { page: 1, pages: 1, status: '' } };
    const $ = (id) => document.getElementById(id);

    function banner(text, isError = false) {
      const el = $('banner');
      el.textContent = text;
      el.classList.toggle('error', isError);
      el.classList.toggle('hidden', !text);
      if (text) setTimeout(() => el.classList.add('hidden'), 6000);
    }

    function fail(error) {
      banner(error && error.message ? error.message : String(error), true);
    }

    function el(tag, props = {}, children = []) {
      const node = document.createElement(tag);
      for (const [key, value] of Object.entries(props)) {
        if (key === 'text') node.textContent = value;
        else if (key === 'class') node.className = value;
        else node.setAttribute(key, value);
      }
      for (const child of children) node.append(child);
      return node;
    }

    function link(href, label) {
      const a = el('a', { class: 'cell-link', href: href || '#', target: '_blank', rel: 'noreferrer noopener' });
      a.textContent = label;
      return a;
    }

    function emptyBlock(title, hint) {
      return el('div', { class: 'empty maibot-card maibot-muted' }, [
        el('p', { class: 'empty-title', text: title }),
        el('p', { text: hint }),
      ]);
    }

    function renderOverview(data) {
      if (!data || data.ready === false) { $('subtitle').textContent = '插件未加载，无法读取数据'; return; }
      $('subtitle').textContent = `全局轮询 ${data.poll_interval_minutes} 分钟 · 默认推送 ${data.default_push_mode}`;
      const cards = [
        ['订阅', data.subscriptions], ['来源', data.feeds], ['会话', data.sessions],
        ['24 小时推送', data.pushes_24h], ['24 小时失败', data.failures_24h], ['待重试', data.pending_retry],
      ];
      $('cards').replaceChildren(...cards.map(([label, value]) =>
        el('div', { class: 'maibot-card' }, [
          el('div', { class: 'maibot-muted stat-label', text: label }),
          el('div', { class: 'maibot-number stat-value', text: String(value) }),
        ])));
    }

    async function loadOverview() {
      try { renderOverview(await maibot.query('overview')); } catch (error) { fail(error); }
    }

    async function loadSubs(page = state.subs.page) {
      try {
        const data = await maibot.query('subscriptions', { page, page_size: 20, keyword: state.subs.keyword });
        state.subs.page = data.page; state.subs.pages = data.pages;
        $('subs-page').textContent = `${data.page} / ${data.pages}（共 ${data.total} 条）`;
        const body = $('subs-body');
        if (!data.items.length) {
          body.replaceChildren(emptyBlock(state.subs.keyword ? '没有匹配的订阅' : '还没有订阅', state.subs.keyword ? '换个关键词试试' : '用 /订阅 <地址> 添加，或到「批量导入」里一次加多个'));
          return;
        }
        body.replaceChildren(...data.items.map((item) => {
          const card = el('article', { class: 'sub-card maibot-card' });
          const head = el('div', { class: 'sub-head' });
          const title = el('div', { class: 'sub-title' }, [link(item.link, item.title || item.link || `#${item.id}`)]);
          const actions = el('div', { class: 'sub-actions' }, [
            button('立即抓取', () => pollNow(item.id)),
            button(item.state ? '停用' : '启用', () => setState(item.id, !item.state)),
            button('删除', () => deleteSub(item.id), 'maibot-button-danger'),
          ]);
          head.append(title, actions);

          const meta = el('div', { class: 'sub-meta' });
          const session = el('div', { class: 'meta-item' }, [
            el('span', { class: 'maibot-muted', text: '会话' }),
            el('span', { class: 'maibot-muted', text: item.session_label || item.session || '未绑定', title: item.session || '' }),
          ]);
          const mode = el('div', { class: 'meta-item' }, [
            el('span', { class: 'maibot-muted', text: '推送模式' }),
            modeSelect(item),
          ]);
          const interval = el('div', { class: 'meta-item' }, [
            el('span', { class: 'maibot-muted', text: '间隔（分钟）' }),
            intervalInput(item),
          ]);
          const next = el('div', { class: 'meta-item' }, [
            el('span', { class: 'maibot-muted', text: '下次抓取' }),
            el('span', { class: 'maibot-muted', text: item.next_check_at ? item.next_check_at.replace('T', ' ').slice(0, 19) : '—' }),
          ]);
          meta.append(session, mode, interval, next);
          card.append(head, meta);
          return card;
        }));
      } catch (error) { fail(error); }
    }

    function button(label, onClick, variant = '') {
      const btn = el('button', { class: `maibot-button ${variant}`.trim(), type: 'button' });
      btn.textContent = label;
      btn.addEventListener('click', onClick);
      return btn;
    }

    function modeSelect(item) {
      const select = el('select', { class: 'maibot-select', 'aria-label': '推送模式' });
      for (const [value, label] of [['inherit', '继承'], ['persona', '人格化'], ['direct', '直推'], ['silent', '静默']]) {
        const option = el('option', { value });
        option.textContent = label;
        select.append(option);
      }
      select.value = item.push_mode || 'inherit';
      select.addEventListener('change', () => updateSub(item.id, 'push_mode', select.value));
      return select;
    }

    function intervalInput(item) {
      const input = el('input', { class: 'maibot-input', type: 'number', min: '1', max: '1440', 'aria-label': '轮询间隔（分钟）' });
      input.value = item.interval_minutes > 0 ? String(item.interval_minutes) : '';
      input.placeholder = '继承';
      const commit = () => {
        const raw = input.value.trim();
        if (!raw) return;
        const minutes = Number(raw);
        if (!Number.isInteger(minutes) || minutes < 1 || minutes > 1440) { banner('间隔需为 1–1440 的整数', true); return; }
        updateSub(item.id, 'interval', String(minutes));
      };
      input.addEventListener('change', commit);
      return input;
    }

    async function updateSub(subId, key, value) {
      try {
        await maibot.action('update_subscription', { sub_id: subId, key, value });
        banner(`已更新订阅 #${subId}`);
        await Promise.all([loadOverview(), loadSubs()]);
      } catch (error) { fail(error); }
    }

    async function setState(subId, enabled) {
      try {
        await maibot.action('set_state', { sub_id: subId, enabled });
        banner(`订阅 #${subId} 已${enabled ? '启用' : '停用'}`);
        await Promise.all([loadOverview(), loadSubs()]);
      } catch (error) { fail(error); }
    }

    async function deleteSub(subId) {
      try {
        await maibot.action('delete_subscription', { sub_id: subId });
        banner(`订阅 #${subId} 已删除`);
        await Promise.all([loadOverview(), loadSubs()]);
      } catch (error) { fail(error); }
    }

    async function pollNow(subId) {
      try {
        await maibot.action('poll_now', { sub_id: subId });
        banner(`已把订阅 #${subId} 排入下一轮抓取`);
      } catch (error) { fail(error); }
    }

    async function loadHistory(page = state.history.page) {
      try {
        const data = await maibot.query('history', { page, page_size: 20, status: state.history.status });
        state.history.page = data.page; state.history.pages = data.pages;
        $('history-page').textContent = `${data.page} / ${data.pages}（共 ${data.total} 条）`;
        const body = $('history-body');
        if (!data.items.length) {
          body.replaceChildren(emptyBlock('还没有推送记录', '有订阅并抓到新条目后，这里会列出每一次推送与失败原因'));
          return;
        }
        body.replaceChildren(...data.items.map((item) => {
          const card = el('article', { class: 'history-card maibot-card' });
          const head = el('div', { class: 'history-head' }, [
            el('span', { class: 'maibot-muted', text: (item.created_at || '').replace('T', ' ').slice(0, 19) }),
            el('span', { class: 'maibot-badge', text: item.status || '—' }),
          ]);
          const title = el('div', {}, [link(item.link, item.title || item.link || `#${item.id}`)]);
          if (item.fail_reason) title.append(el('div', { class: 'maibot-muted', text: item.fail_reason }));
          const meta = el('div', { class: 'history-meta maibot-muted' }, [
            el('span', { text: `来源 ${item.feed_title || '—'}` }),
            el('span', { text: `会话 ${item.session_label || item.session || '—'}`, title: item.session || '' }),
            item.retry_count ? el('span', { text: `重试 ×${item.retry_count}` }) : '',
          ].filter(Boolean));
          card.append(head, el('div', { class: 'history-body' }, [title, meta]));
          return card;
        }));
      } catch (error) { fail(error); }
    }

    function switchView(view) {
      for (const tab of document.querySelectorAll('.tabs .maibot-button')) {
        const active = tab.dataset.view === view;
        tab.setAttribute('aria-selected', String(active));
        tab.setAttribute('aria-pressed', String(active));
      }
      $('view-subs').classList.toggle('hidden', view !== 'subs');
      $('view-history').classList.toggle('hidden', view !== 'history');
      $('view-import').classList.toggle('hidden', view !== 'import');
      if (view === 'history') loadHistory(1);
    }

    document.querySelectorAll('.tabs .maibot-button').forEach((tab) => tab.addEventListener('click', () => switchView(tab.dataset.view)));
    $('keyword').addEventListener('change', () => { state.subs.keyword = $('keyword').value.trim(); loadSubs(1); });
    $('reload-subs').addEventListener('click', () => { loadOverview(); loadSubs(); });
    $('history-status').addEventListener('change', () => { state.history.status = $('history-status').value; loadHistory(1); });
    $('reload-history').addEventListener('click', () => loadHistory(1));
    $('subs-prev').addEventListener('click', () => { if (state.subs.page > 1) loadSubs(state.subs.page - 1); });
    $('subs-next').addEventListener('click', () => { if (state.subs.page < state.subs.pages) loadSubs(state.subs.page + 1); });
    $('history-prev').addEventListener('click', () => { if (state.history.page > 1) loadHistory(state.history.page - 1); });
    $('history-next').addEventListener('click', () => { if (state.history.page < state.history.pages) loadHistory(state.history.page + 1); });
    $('do-import').addEventListener('click', async () => {
      const links = $('import-links').value.trim();
      if (!links) { banner('请先填写要导入的地址', true); return; }
      try {
        const result = await maibot.action('import_subscriptions', {
          links,
          session: $('import-session').value.trim(),
          title: $('import-title').value.trim(),
        });
        const failed = result.failed && result.failed.length ? `；失败 ${result.failed.length} 条：${result.failed[0]}` : '';
        banner(`已导入 ${result.imported} 条${failed}`, Boolean(result.failed && result.failed.length));
        await Promise.all([loadOverview(), loadSubs(1)]);
      } catch (error) { fail(error); }
    });

    await loadOverview();
    await loadSubs(1);
  </script>
</body>
</html>
