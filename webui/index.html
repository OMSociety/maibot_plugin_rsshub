<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RSS 订阅</title>
<style>
  /* 布局在这里；外观颜色、字体、边框、圆角全部使用宿主公共变量。 */
  * { box-sizing: border-box; }
  html, body { max-width: 100%; overflow-x: hidden; }
  body { padding: 20px 24px 40px; }
  .page-title { font-family: var(--maibot-font-display); font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  .subtitle { font-size: 12px; margin-bottom: 16px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 16px 0 20px; }
  .stat-label { font-size: 12px; }
  .stat-value { font-size: 22px; font-weight: 600; margin-top: 4px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .toolbar .maibot-input { width: 240px; max-width: 100%; }
  .cards-list, .history-list { display: grid; gap: 12px; }
  .sub-card { padding: 14px 16px; }
  .sub-card.is-paused { opacity: 0.68; }
  .sub-head, .history-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .sub-title { min-width: 0; flex: 1 1 260px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .sub-actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .sub-actions .maibot-button { padding: 6px 12px; font-size: 12px; }
  .sub-meta { display: flex; flex-wrap: wrap; gap: 10px 28px; font-size: 13px; }
  .meta-item { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .meta-item .maibot-muted { flex: 0 0 auto; }
  .meta-item select.maibot-select, .meta-item input.maibot-input { padding: 5px 10px; font-size: 13px; }
  .meta-item select.maibot-select { min-width: 96px; }
  .meta-item input.maibot-input { width: 88px; }
  .cell-link { display: inline-block; max-width: 100%; overflow-wrap: anywhere; word-break: break-all; color: var(--maibot-primary); text-decoration: none; cursor: pointer; }
  .cell-link:hover { text-decoration: underline; }
  .sub-title .cell-link { font-weight: 600; }
  .history-card { padding: 12px 14px; font-size: 13px; }
  .history-body { display: grid; gap: 4px; }
  .history-meta { display: flex; flex-wrap: wrap; gap: 8px 16px; }
  .pager { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  .maibot-button:focus-visible, .maibot-input:focus-visible, .maibot-select:focus-visible, .cell-link:focus-visible {
    outline: 2px solid var(--maibot-primary);
    outline-offset: 2px;
  }
  /* document 页面中 fixed 相对整份文档；用宿主同步的可见视口变量定位轻提示。 */
  .toast {
    position: absolute;
    top: calc(var(--maibot-viewport-top, 0px) + var(--maibot-viewport-height, 100vh) - 16px);
    right: 16px;
    z-index: 50;
    max-width: min(420px, calc(100vw - 32px));
    padding: 10px 14px;
    font-size: 13px;
    border: 1px solid var(--maibot-border);
    background: var(--maibot-surface);
    color: var(--maibot-foreground);
    opacity: 0;
    transform: translateY(calc(-100% + 8px));
    transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events: none;
    overflow-wrap: anywhere;
  }
  .toast.show { opacity: 1; transform: translateY(-100%); }
  .toast.error { color: var(--maibot-danger); border-color: var(--maibot-danger); }
  .form-grid { display: grid; gap: 10px; max-width: 720px; }
  .form-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .form-row label { min-width: 112px; font-size: 13px; }
  .form-row .maibot-input, .form-row .maibot-select { flex: 1; min-width: 180px; }
  textarea.maibot-input { width: 100%; min-height: 140px; font: inherit; font-size: 13px; resize: vertical; }
  .import-job { display: grid; gap: 8px; margin-top: 16px; padding: 12px; }
  .import-job-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
  .import-job progress { width: 100%; accent-color: var(--maibot-primary); }
  .import-job-errors { display: grid; gap: 4px; max-height: 180px; overflow: auto; overflow-wrap: anywhere; }
  .link-preview { display: grid; gap: 8px; margin-top: 16px; }
  .link-preview-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .link-preview-row .maibot-input { flex: 1 1 280px; min-width: 0; }
  .maibot-select option { background: var(--maibot-surface); color: var(--maibot-foreground); }
  .hidden { display: none !important; }
  .empty { padding: 24px 16px; text-align: center; }
  .empty p { margin: 6px 0; }
  .empty .empty-title { font-size: 15px; font-weight: 600; }
  .loading { padding: 14px 12px; }
  @media (max-width: 640px) {
    body { padding: 14px 14px 28px; }
    .sub-head { flex-direction: column; align-items: stretch; }
    .sub-title { flex: 0 0 auto; }
    .sub-actions { justify-content: flex-start; }
    .toolbar .maibot-input { width: 100%; }
  }
</style>
</head>
<body class="maibot-page">
  <h1 class="page-title">RSS 订阅</h1>
  <div class="maibot-muted subtitle" id="subtitle">正在加载…</div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <section class="stats" id="cards"></section>

  <div class="tabs" role="tablist" aria-label="管理视图">
    <button class="maibot-button" type="button" role="tab" aria-selected="true" aria-pressed="true" data-view="subs">订阅</button>
    <button class="maibot-button" type="button" role="tab" aria-selected="false" aria-pressed="false" data-view="history">推送历史</button>
    <button class="maibot-button" type="button" role="tab" aria-selected="false" aria-pressed="false" data-view="import">批量导入</button>
  </div>

  <section id="view-subs">
    <div class="toolbar">
      <input class="maibot-input" id="keyword" placeholder="按标题、链接或会话筛选" aria-label="筛选订阅">
      <button class="maibot-button" type="button" id="reload-subs">刷新</button>
    </div>
    <div class="cards-list" id="subs-body"><div class="maibot-muted loading">加载中…</div></div>
    <div class="pager">
      <button class="maibot-button" type="button" id="subs-prev">上一页</button>
      <span class="maibot-muted" id="subs-page">1 / 1</span>
      <button class="maibot-button" type="button" id="subs-next">下一页</button>
    </div>
  </section>

  <section id="view-history" class="hidden">
    <div class="toolbar">
      <label class="maibot-muted" for="history-status">状态</label>
      <select class="maibot-select" id="history-status" aria-label="状态筛选">
        <option value="">全部状态</option>
        <option value="success">成功</option>
        <option value="failed">失败</option>
        <option value="stopped">已停止</option>
        <option value="skipped">已过滤</option>
      </select>
      <button class="maibot-button" type="button" id="reload-history">刷新</button>
    </div>
    <div class="history-list" id="history-body"><div class="maibot-muted loading">加载中…</div></div>
    <div class="pager">
      <button class="maibot-button" type="button" id="history-prev">上一页</button>
      <span class="maibot-muted" id="history-page">1 / 1</span>
      <button class="maibot-button" type="button" id="history-next">下一页</button>
    </div>
  </section>

  <section id="view-import" class="hidden">
    <p class="maibot-muted">每行一个 Feed 地址或 RSSHub 路由；目标会话必填，导入的订阅会推送到该会话。</p>
    <div class="form-grid">
      <div class="form-row hidden" id="import-session-pick-row">
        <label class="maibot-muted" for="import-session-pick">已有会话快选</label>
        <select class="maibot-select" id="import-session-pick">
          <option value="">从已有订阅会话选择…</option>
        </select>
      </div>
      <div class="form-row">
        <label class="maibot-muted" for="import-session">目标会话（必填）</label>
        <input class="maibot-input" id="import-session" placeholder="选上方已有会话，或填宿主会话 stream_id">
      </div>
      <div class="form-row">
        <label class="maibot-muted" for="import-title">统一标题</label>
        <input class="maibot-input" id="import-title" placeholder="留空则用订阅源自己的标题">
      </div>
      <textarea class="maibot-input" id="import-links" aria-label="订阅地址列表" placeholder="https://example.com/feed.xml&#10;/github/trending/daily"></textarea>
      <div><button class="maibot-button maibot-button-primary" type="button" id="do-import">开始导入</button></div>
    </div>
    <div id="import-job" class="import-job maibot-inset hidden" role="status" aria-live="polite">
      <div class="import-job-head"><strong>导入任务</strong><span class="maibot-badge" id="import-job-status"></span></div>
      <progress id="import-job-progress" max="1" value="0"></progress>
      <div class="maibot-muted" id="import-job-text"></div>
      <div class="maibot-muted" id="import-job-current"></div>
      <div class="import-job-errors maibot-muted" id="import-job-errors"></div>
    </div>
  </section>

  <section id="link-preview" class="link-preview maibot-card hidden" aria-label="订阅链接">
    <strong id="link-title">订阅链接</strong>
    <div class="maibot-muted">沙盒页面不打开外部窗口；可复制下面的地址到浏览器打开。</div>
    <div class="link-preview-row">
      <input class="maibot-input" id="link-url" type="text" readonly aria-label="可复制的订阅链接">
      <button class="maibot-button" type="button" id="copy-link">复制地址</button>
      <button class="maibot-button" type="button" id="close-link">关闭</button>
    </div>
  </section>

  <script type="module">
    await maibot.ready;

    const MODE_LABELS = { persona: '人格化', direct: '直推', silent: '注入' };
    const STATUS_LABELS = { success: '成功', failed: '失败', stopped: '已停止', skipped: '已过滤' };
    const IMPORT_STATUS_LABELS = { running: '进行中', completed: '已完成', failed: '失败', cancelled: '已取消', unknown: '任务已失效' };
    const state = { subs: { page: 1, pages: 1, keyword: '' }, history: { page: 1, pages: 1, status: '' } };
    let requestTail = Promise.resolve();
    function enqueue(request) {
      const result = requestTail.then(request);
      requestTail = result.then(() => undefined, () => undefined);
      return result;
    }
    const api = {
      query: (...args) => enqueue(() => maibot.query(...args)),
      action: (...args) => enqueue(() => maibot.action(...args)),
    };
    const $ = (id) => document.getElementById(id);
    let subsRequest = 0;
    let historyRequest = 0;
    let importJobId = '';
    let importTimer = 0;

    function fmtTime(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return String(iso).replace('T', ' ').slice(0, 19);
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    let toastTimer = 0;
    function toast(text, isError = false) {
      const node = $('toast');
      node.textContent = text;
      node.classList.toggle('error', isError);
      node.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => node.classList.remove('show'), isError ? 6000 : 2500);
    }

    function fail(error) {
      toast(error && error.message ? error.message : String(error), true);
    }

    function el(tag, props = {}, children = []) {
      const node = document.createElement(tag);
      for (const [key, value] of Object.entries(props)) {
        if (key === 'text') node.textContent = value;
        else if (key === 'class') node.className = value;
        else node.setAttribute(key, value);
      }
      for (const child of children) node.append(child);
      return node;
    }

    function showLink(href, label) {
      $('link-title').textContent = label || '订阅链接';
      $('link-url').value = href || '';
      $('link-preview').classList.remove('hidden');
      $('link-url').focus();
      $('link-url').select();
    }

    function link(href, label) {
      const a = el('a', { class: 'cell-link', href: '#', role: 'link', title: href || '' });
      a.textContent = label;
      a.addEventListener('click', (event) => { event.preventDefault(); showLink(href, label); });
      return a;
    }

    function emptyBlock(title, hint) {
      return el('div', { class: 'empty maibot-card maibot-muted' }, [
        el('p', { class: 'empty-title', text: title }),
        el('p', { text: hint }),
      ]);
    }

    function renderOverview(data) {
      if (!data || data.ready === false) { $('subtitle').textContent = '插件未加载，无法读取数据'; return; }
      const modeLabel = MODE_LABELS[data.default_push_mode] || data.default_push_mode;
      $('subtitle').textContent = `全局轮询 ${data.poll_interval_minutes} 分钟 · 默认推送：${modeLabel}`;
      const cards = [
        ['订阅', data.subscriptions], ['来源', data.feeds], ['会话', data.sessions],
        ['24 小时推送', data.pushes_24h], ['24 小时失败', data.failures_24h], ['待重试', data.pending_retry],
      ];
      $('cards').replaceChildren(...cards.map(([label, value]) =>
        el('div', { class: 'maibot-card' }, [
          el('div', { class: 'maibot-muted stat-label', text: label }),
          el('div', { class: 'maibot-number stat-value', text: String(value) }),
        ])));
      const known = Array.isArray(data.known_sessions) ? data.known_sessions : [];
      const pickRow = $('import-session-pick-row');
      const pick = $('import-session-pick');
      pickRow.classList.toggle('hidden', !known.length);
      if (known.length) {
        const current = $('import-session').value.trim();
        pick.replaceChildren(
          el('option', { value: '', text: '从已有订阅会话选择…' }),
          ...known.map(({ session, label }) => {
            const short = session.length > 10 ? `${session.slice(0, 8)}…` : session;
            const text = label && label !== session ? `${label}（${short}）` : session;
            return el('option', { value: session, text });
          }),
        );
        if (current && known.some((s) => s.session === current)) pick.value = current;
      }
    }

    async function loadOverview() {
      try { renderOverview(await api.query('overview')); } catch (error) { fail(error); }
    }

    async function loadSubs(page = state.subs.page) {
      const request = ++subsRequest;
      try {
        const data = await api.query('subscriptions', { page, page_size: 20, keyword: state.subs.keyword });
        if (request !== subsRequest) return;
        state.subs.page = data.page; state.subs.pages = data.pages;
        $('subs-page').textContent = `${data.page} / ${data.pages}（共 ${data.total} 条）`;
        $('subs-prev').disabled = data.page <= 1;
        $('subs-next').disabled = data.page >= data.pages;
        const body = $('subs-body');
        if (!data.items.length) {
          body.replaceChildren(emptyBlock(state.subs.keyword ? '没有匹配的订阅' : '还没有订阅', state.subs.keyword ? '换个关键词试试' : '用 /订阅 <地址> 添加，或到「批量导入」里一次加多个'));
          return;
        }
        body.replaceChildren(...data.items.map((item) => {
          const paused = !item.state;
          const card = el('article', { class: `sub-card maibot-card${paused ? ' is-paused' : ''}` });
          const head = el('div', { class: 'sub-head' });
          const titleChildren = [link(item.link, item.title || item.link || `#${item.id}`)];
          if (paused) titleChildren.push(el('span', { class: 'maibot-badge', text: '已停用' }));
          const title = el('div', { class: 'sub-title' }, titleChildren);
          const actions = el('div', { class: 'sub-actions' }, [
            button('立即抓取', () => pollNow(item.id)),
            button(item.state ? '停用' : '启用', () => setState(item.id, !item.state)),
            button('删除', () => deleteSub(item.id), 'maibot-button-danger'),
          ]);
          head.append(title, actions);
          const meta = el('div', { class: 'sub-meta' });
          const session = el('div', { class: 'meta-item' }, [
            el('span', { class: 'maibot-muted', text: '会话' }),
            el('span', { class: 'maibot-muted', text: item.session_label || item.session || '未绑定', title: item.session || '' }),
          ]);
          const mode = el('div', { class: 'meta-item' }, [el('span', { class: 'maibot-muted', text: '推送模式' }), modeSelect(item)]);
          const interval = el('div', { class: 'meta-item' }, [el('span', { class: 'maibot-muted', text: '间隔（分钟）' }), intervalInput(item)]);
          const next = el('div', { class: 'meta-item' }, [
            el('span', { class: 'maibot-muted', text: '下次抓取' }),
            el('span', { class: 'maibot-muted', text: paused ? '已停用' : fmtTime(item.next_check_at) }),
          ]);
          meta.append(session, mode, interval, next);
          card.append(head, meta);
          return card;
        }));
      } catch (error) { if (request === subsRequest) fail(error); }
    }

    function button(label, onClick, variant = '') {
      const btn = el('button', { class: `maibot-button ${variant}`.trim(), type: 'button', text: label });
      btn.addEventListener('click', onClick);
      return btn;
    }

    function modeSelect(item) {
      const select = el('select', { class: 'maibot-select', 'aria-label': '推送模式' });
      for (const [value, label] of [['inherit', '继承'], ['persona', '人格化'], ['direct', '直推'], ['silent', '注入']]) {
        select.append(el('option', { value, text: label }));
      }
      select.value = item.push_mode || 'inherit';
      select.addEventListener('change', () => updateSub(item.id, 'push_mode', select.value));
      return select;
    }

    function intervalInput(item) {
      const input = el('input', { class: 'maibot-input', type: 'number', min: '1', max: '1440', 'aria-label': '轮询间隔（分钟）' });
      input.value = item.interval_minutes > 0 ? String(item.interval_minutes) : '';
      input.placeholder = '继承';
      input.addEventListener('change', () => {
        const raw = input.value.trim();
        if (!raw) {
          if (item.interval_minutes > 0) updateSub(item.id, 'interval', '0');
          return;
        }
        const minutes = Number(raw);
        if (!Number.isInteger(minutes) || minutes < 1 || minutes > 1440) { toast('间隔需为 1–1440 的整数', true); return; }
        updateSub(item.id, 'interval', String(minutes));
      });
      return input;
    }

    async function updateSub(subId, key, value) {
      try {
        await api.action('update_subscription', { sub_id: subId, key, value });
        await loadOverview();
        await loadSubs();
      } catch (error) { fail(error); }
    }

    async function setState(subId, enabled) {
      try {
        await api.action('set_state', { sub_id: subId, enabled });
        await loadOverview();
        await loadSubs();
      } catch (error) { fail(error); }
    }

    async function deleteSub(subId) {
      try {
        await api.action('delete_subscription', { sub_id: subId });
        await loadOverview();
        await loadSubs();
      } catch (error) { fail(error); }
    }

    async function pollNow(subId) {
      try {
        await api.action('poll_now', { sub_id: subId });
        toast(`已把订阅 #${subId} 排入下一轮抓取`);
      } catch (error) { fail(error); }
    }

    async function loadHistory(page = state.history.page) {
      const request = ++historyRequest;
      try {
        const data = await api.query('history', { page, page_size: 20, status: state.history.status });
        if (request !== historyRequest) return;
        state.history.page = data.page; state.history.pages = data.pages;
        $('history-page').textContent = `${data.page} / ${data.pages}（共 ${data.total} 条）`;
        $('history-prev').disabled = data.page <= 1;
        $('history-next').disabled = data.page >= data.pages;
        const body = $('history-body');
        if (!data.items.length) {
          body.replaceChildren(emptyBlock('还没有推送记录', '有订阅并抓到新条目后，这里会列出每一次推送与失败原因'));
          return;
        }
        body.replaceChildren(...data.items.map((item) => {
          const card = el('article', { class: 'history-card maibot-card' });
          const head = el('div', { class: 'history-head' }, [
            el('span', { class: 'maibot-muted', text: fmtTime(item.created_at) }),
            el('span', { class: 'maibot-badge', text: STATUS_LABELS[item.status] || item.status || '—' }),
          ]);
          const title = el('div', {}, [link(item.link, item.title || item.link || `#${item.id}`)]);
          if (item.fail_reason) title.append(el('div', { class: 'maibot-muted', text: item.fail_reason }));
          const meta = el('div', { class: 'history-meta maibot-muted' }, [
            el('span', { text: `来源 ${item.feed_title || '—'}` }),
            el('span', { text: `会话 ${item.session_label || item.session || '—'}`, title: item.session || '' }),
            item.retry_count ? el('span', { text: `重试 ×${item.retry_count}` }) : '',
          ].filter(Boolean));
          card.append(head, el('div', { class: 'history-body' }, [title, meta]));
          return card;
        }));
      } catch (error) { if (request === historyRequest) fail(error); }
    }

    function renderImportJob(job) {
      if (!job) { $('import-job').classList.add('hidden'); return; }
      $('import-job').classList.remove('hidden');
      $('import-job-status').textContent = IMPORT_STATUS_LABELS[job.status] || job.status || '进行中';
      const total = Number(job.total) || 0;
      const processed = Number(job.processed) || 0;
      $('import-job-progress').max = Math.max(total, 1);
      $('import-job-progress').value = Math.min(processed, Math.max(total, 1));
      $('import-job-text').textContent = `已处理 ${processed}/${total} 条 · 新增 ${job.imported || 0} · 已存在 ${job.duplicated || 0} · 失败 ${job.failed_count || 0}`;
      $('import-job-current').textContent = job.status === 'running' && job.current ? `当前：${job.current}` : (job.error || '');
      const failures = Array.isArray(job.failed) ? job.failed : [];
      const extra = (job.failed_count || 0) > failures.length ? [`另有 ${(job.failed_count || 0) - failures.length} 条失败详情未展开`] : [];
      $('import-job-errors').replaceChildren(...[...failures, ...extra].map((text) => el('div', { text })));
    }

    async function pollImport(jobId) {
      try {
        const job = await api.query('import_status', { job_id: jobId });
        if (jobId !== importJobId) return;
        renderImportJob(job);
        if (job.status === 'unknown') {
          importJobId = '';
          $('do-import').disabled = false;
          fail(job.error || '导入任务已失效，请重新提交');
          return;
        }
        if (job.status === 'running') {
          clearTimeout(importTimer);
          importTimer = setTimeout(() => pollImport(jobId), 500);
          return;
        }
        importJobId = '';
        $('do-import').disabled = false;
        await loadOverview();
        await loadSubs(1);
        const failed = Number(job.failed_count) || 0;
        toast(`导入完成：新增 ${job.imported || 0} 条，已存在 ${job.duplicated || 0} 条${failed ? `，失败 ${failed} 条` : ''}`, failed > 0 || job.status === 'failed');
      } catch (error) {
        if (jobId !== importJobId) return;
        importJobId = '';
        $('do-import').disabled = false;
        fail(error);
      }
    }

    function switchView(view) {
      for (const tab of document.querySelectorAll('.tabs .maibot-button')) {
        const active = tab.dataset.view === view;
        tab.setAttribute('aria-selected', String(active));
        tab.setAttribute('aria-pressed', String(active));
      }
      $('view-subs').classList.toggle('hidden', view !== 'subs');
      $('view-history').classList.toggle('hidden', view !== 'history');
      $('view-import').classList.toggle('hidden', view !== 'import');
      if (view === 'history') loadHistory(1);
    }

    let keywordTimer = 0;
    const applyKeyword = () => {
      clearTimeout(keywordTimer);
      const next = $('keyword').value.trim();
      if (next === state.subs.keyword) return;
      state.subs.keyword = next;
      loadSubs(1);
    };

    document.querySelectorAll('.tabs .maibot-button').forEach((tab) => tab.addEventListener('click', () => switchView(tab.dataset.view)));
    $('keyword').addEventListener('input', () => { clearTimeout(keywordTimer); keywordTimer = setTimeout(applyKeyword, 250); });
    $('keyword').addEventListener('change', applyKeyword);
    $('import-session-pick').addEventListener('change', () => {
      const val = $('import-session-pick').value;
      if (val) $('import-session').value = val;
    });
    $('reload-subs').addEventListener('click', () => { loadOverview(); loadSubs(); });
    $('history-status').addEventListener('change', () => { state.history.status = $('history-status').value; loadHistory(1); });
    $('reload-history').addEventListener('click', () => loadHistory(1));
    $('subs-prev').addEventListener('click', () => { if (state.subs.page > 1) loadSubs(state.subs.page - 1); });
    $('subs-next').addEventListener('click', () => { if (state.subs.page < state.subs.pages) loadSubs(state.subs.page + 1); });
    $('history-prev').addEventListener('click', () => { if (state.history.page > 1) loadHistory(state.history.page - 1); });
    $('history-next').addEventListener('click', () => { if (state.history.page < state.history.pages) loadHistory(state.history.page + 1); });
    $('close-link').addEventListener('click', () => $('link-preview').classList.add('hidden'));
    $('copy-link').addEventListener('click', async () => {
      const input = $('link-url');
      try {
        await navigator.clipboard.writeText(input.value);
        toast('地址已复制');
      } catch {
        input.focus(); input.select();
        toast('已选中地址，请使用复制命令');
      }
    });
    $('do-import').addEventListener('click', async () => {
      const links = $('import-links').value.trim();
      const session = $('import-session').value.trim();
      if (!links) { toast('请先填写要导入的地址', true); return; }
      if (!session) { toast('请填写目标会话 ID，否则订阅建立后没有推送对象', true); return; }
      if (importJobId) { toast('已有一批订阅正在导入，请等它完成', true); return; }
      $('do-import').disabled = true;
      try {
        const result = await api.action('import_subscriptions', { links, session, title: $('import-title').value.trim() });
        importJobId = result.job_id;
        renderImportJob(result);
        toast('导入已开始，可切换到其它视图查看订阅');
        await pollImport(importJobId);
      } catch (error) {
        importJobId = '';
        $('do-import').disabled = false;
        fail(error);
      }
    });

    await loadOverview();
    await loadSubs(1);
  </script>
</body>
</html>
